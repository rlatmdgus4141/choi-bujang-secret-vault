<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    [hidden] { display: none !important; }
    .auth { padding: 22px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    label { display: block; margin: 14px 0 6px; }
    input, textarea, button { box-sizing: border-box; font: inherit; border-radius: 8px; padding: 12px; }
    input, textarea { width: 100%; border: 1px solid #72869d; background: #101a28; color: #ecf4ff; }
    textarea { min-height: 120px; resize: vertical; }
    li span { white-space: pre-wrap; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .secondary { background: #bfcee0; }
    button { margin-top: 16px; border: 0; background: #8ad8df; color: #101a28; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    :focus-visible { outline: 3px solid #f4cb6b; outline-offset: 3px; }
    #auth-message { color: #ffe3e8; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>
    <h1>내 자료실</h1>
    <p>실습용 계정으로 로그인하세요. 메모에는 가상 자료만 사용합니다.</p>
    <div class="notice">내 가상 메모를 추가하고 수정·삭제할 수 있습니다. 개인 메모의 소유자 검사는 다음 단계에서 적용합니다.</div>
    <section class="auth" aria-labelledby="auth-heading">
      <h2 id="auth-heading">로그인</h2>
      <p id="auth-state" role="status">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden>
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-message" role="alert"></p>
    </section>
    <section id="notes-section" hidden aria-labelledby="notes-heading">
      <h2 id="notes-heading">내 가상 메모</h2>
      <form id="note-form" class="auth">
        <h3 id="editor-heading">새 메모</h3>
        <label for="note-title">제목</label>
        <input id="note-title" maxlength="200" required>
        <label for="note-body">내용</label>
        <textarea id="note-body" maxlength="20000"></textarea>
        <div class="actions">
          <button id="save-note" type="submit">메모 추가</button>
          <button id="cancel-edit" class="secondary" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <p id="note-message" role="status"></p>
      <ul id="notes" aria-live="polite"></ul>
    </section>
    <noscript><p>로그인하려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>
  </main>
  <script src="/vendor/supabase.js" defer></script>
  <script src="/auth.js" defer></script>
</body>
</html>
